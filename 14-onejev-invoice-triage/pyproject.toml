[project]
name = "onejev-invoice-triage"
version = "1.0.0"
description = "Local invoice triage with OneJev: one image in, typed accounting decisions out"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.34",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "qev",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.uv.sources]
qev = { git = "https://github.com/OmniJev/OneJev.git", rev = "81ce62f1597c91e46767d4d02d6ac2e18534fe94" }
